name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.19
      - name: Run native and sanitizer tests
        run: pio test -e native -e native_sanitize
      - name: Compile normal controller firmware
        run: pio run -e controller_1
      - name: Build pinned rBoot and rBoot application
        env:
          PLATFORMIO_BUILD_FLAGS: '-DFIRMWARE_VERSION=\"0.0.0-dev\"'
        run: |
          scripts/build-rboot.sh
          pio run -e controller_1_rboot
          python scripts/verify-rboot-image.py \
            --elf .pio/build/controller_1_rboot/firmware.elf \
            --image .pio/build/controller_1_rboot/rboot-app.bin \
            --esptool2 .pio/rboot-upstream/esptool2/esptool2
          test "$(wc -c < .pio/rboot-artifacts/rboot.bin)" -le 4096
      - name: Prove firmware is independent of provisioning inputs
        run: |
          scripts/verify-signing-key.py
          scripts/prove-generic-firmware.sh

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.19
      - name: Build release image
        env:
          PLATFORMIO_BUILD_FLAGS: '-DFIRMWARE_VERSION=\"${{ steps.version.outputs.version }}\"'
        run: |
          scripts/build-rboot.sh
          pio run -e controller_1_rboot
          python scripts/verify-rboot-image.py \
            --elf .pio/build/controller_1_rboot/firmware.elf \
            --image .pio/build/controller_1_rboot/rboot-app.bin \
            --esptool2 .pio/rboot-upstream/esptool2/esptool2
      - name: Sign and package server firmware repository
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.FIRMWARE_SIGNING_PRIVATE_KEY }}
        run: |
          [[ -n "$SIGNING_PRIVATE_KEY" ]] || { echo 'FIRMWARE_SIGNING_PRIVATE_KEY is not configured' >&2; exit 1; }
          umask 077
          printf '%s\n' "$SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/firmware-signing-private.pem"
          scripts/sign-firmware.sh \
            .pio/build/controller_1_rboot/rboot-app.bin \
            "$RUNNER_TEMP/firmware-signing-private.pem" \
            mindflayer-keypad-v1 \
            "${{ steps.version.outputs.version }}" \
            dist/firmware
          tar -C dist/firmware -czf "dist/mindflayer-keypad-${{ steps.version.outputs.version }}-server-firmware.tar.gz" .
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindflayer-keypad-${{ steps.version.outputs.version }}-server-firmware
          path: dist/firmware
          if-no-files-found: error
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="dist/mindflayer-keypad-${{ steps.version.outputs.version }}-server-firmware.tar.gz"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --verify-tag --generate-notes
          fi
