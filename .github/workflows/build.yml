name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.19
      - name: Run native and sanitizer tests
        run: pio test -e native -e native_sanitize
      - name: Compile normal controller firmware
        run: pio run -e controller_1
      - name: Build pinned rBoot and rBoot application
        env:
          PLATFORMIO_BUILD_FLAGS: '-DFIRMWARE_VERSION=\"0.0.0-dev\"'
        run: |
          scripts/build-rboot.sh
          pio run -e controller_1_rboot
          python scripts/verify-rboot-image.py \
            --elf .pio/build/controller_1_rboot/firmware.elf \
            --image .pio/build/controller_1_rboot/rboot-app.bin \
            --esptool2 .pio/rboot-upstream/esptool2/esptool2
          test "$(wc -c < .pio/rboot-artifacts/rboot.bin)" -le 4096
      - name: Prove firmware is independent of provisioning inputs
        run: |
          scripts/verify-signing-key.py
          scripts/prove-generic-firmware.sh

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: semantic-release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install release dependencies
        run: npm ci
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.19
      - name: Create semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRMWARE_SIGNING_PRIVATE_KEY: ${{ secrets.FIRMWARE_SIGNING_PRIVATE_KEY }}
        run: npx semantic-release
