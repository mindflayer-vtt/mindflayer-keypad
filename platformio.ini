; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[esp8266]
platform = espressif8266
board = d1_mini_lite
board_build.ldscript = ld/eagle.flash.4m0m.ld
board_upload.maximum_size = 4194304
framework = arduino
lib_deps = 
    gilmaimon/ArduinoWebsockets@0.5.4
    ESP8266WiFi
    https://github.com/laurencelundblade/QCBOR.git#930708bb86481e88879eb1d87fd4d664f1d69503
    makuna/NeoPixelBus@2.8.4
upload_speed = 115200
monitor_speed = 115200
build_flags =
  -I.pio/libdeps/$PIOENV/QCBOR/inc
  -DQCBOR_DISABLE_INDEFINITE_LENGTH_STRINGS
  -DQCBOR_DISABLE_INDEFINITE_LENGTH_ARRAYS
  -DQCBOR_DISABLE_TAGS
  -DQCBOR_DISABLE_EXP_AND_MANTISSA
  -DQCBOR_DISABLE_PREFERRED_FLOAT
  -DQCBOR_DISABLE_FLOAT_HW_USE
  -DUSEFULBUF_DISABLE_ALL_FLOAT
extra_scripts = pre:scripts/patch-arduino-websockets.py

[env:native]
platform = native
lib_deps = https://github.com/laurencelundblade/QCBOR.git#930708bb86481e88879eb1d87fd4d664f1d69503
lib_compat_mode = off
test_framework = unity
build_flags =
  -lcrypto
  -I.pio/libdeps/$PIOENV/QCBOR/inc
  -DQCBOR_DISABLE_INDEFINITE_LENGTH_STRINGS
  -DQCBOR_DISABLE_INDEFINITE_LENGTH_ARRAYS
  -DQCBOR_DISABLE_TAGS
  -DQCBOR_DISABLE_EXP_AND_MANTISSA
  -DQCBOR_DISABLE_PREFERRED_FLOAT
  -DQCBOR_DISABLE_FLOAT_HW_USE
  -DUSEFULBUF_DISABLE_ALL_FLOAT

[env:native_sanitize]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -fsanitize=address,undefined
  -fno-omit-frame-pointer

[env:controller_1]
extends = esp8266
build_flags = ${esp8266.build_flags}

[rboot_app]
extends = esp8266
board_upload.flash_size = 4MB
board_upload.maximum_size = 1040384
board_build.ldscript = ld/eagle.flash.4m-rboot.ld
extra_scripts =
  pre:scripts/patch-arduino-websockets.py
  scripts/rboot_platformio.py
build_flags =
  ${esp8266.build_flags}
  -DRBOOT_INTEGRATION
  -DBOOT_RTC_ENABLED
  -DBOOT_BIG_FLASH
  -DBOOT_CONFIG_CHKSUM
  -DBOOT_IROM_CHKSUM

[env:controller_1_rboot]
extends = rboot_app
build_flags = ${rboot_app.build_flags}

[env:controller_1_rboot_fault]
extends = env:controller_1_rboot
build_flags =
  ${env:controller_1_rboot.build_flags}
  -DRBOOT_FAULT_INJECTION

[env:controller_1_rboot_unhealthy]
extends = env:controller_1_rboot
build_flags =
  ${env:controller_1_rboot.build_flags}
  -DTEST_FAIL_BEFORE_SERVER_ACK

[env:controller_1_rboot_corrupt]
extends = env:controller_1_rboot
build_flags =
  ${env:controller_1_rboot.build_flags}
  -DTEST_CORRUPT_CANDIDATE_AFTER_VALIDATION

[env:controller_1_ota]
extends = esp8266
build_flags = ${esp8266.build_flags}
upload_port = controller1

